name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

permissions:
  actions: read

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Download the site from the completed build
        uses: actions/download-artifact@v4
        with:
          name: site-for-link-checks
          path: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Check the generated pages, including root-relative links.
          # Preserve the asset remap for Lychee 0.14's handling of srcset entries.
          args: >-
            --offline --base '${{ github.workspace }}/_site'
            --remap '_site(/?.*)/assets/(.*) _site/assets/$2'
            --verbose --no-progress '_site/**/*.html'
