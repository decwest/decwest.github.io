name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Local paths are checked after Jekyll renders them in broken-links-site.yml.
          # docs/ contains upstream theme examples that are not published on this site.
          # Vimeo player endpoints reject unauthenticated checks; showcase links are still checked.
          # These three Keio pages return HTTP 200 locally, but repeatedly time out
          # from GitHub-hosted runners (verified 2026-10-27). Keep exceptions URL-specific.
          args: >-
            --user-agent 'Mozilla/5.0 (compatible; lychee/0.14.0)'
            --scheme http --scheme https --max-concurrency 8 --timeout 60
            --exclude '^https://player\.vimeo\.com/video/[0-9]+(?:\?.*)?$'
            --exclude '^https?://www\.yt\.sd\.keio\.ac\.jp/$'
            --exclude '^https://koara\.lib\.keio\.ac\.jp/xoonips/modules/xoonips/detail\.php\?koara_id=KO11003001-20230304-(0036|0058)$'
            --exclude-path docs --exclude-path README.md
            --exclude-path _pages/404.md --exclude-path _pages/blog.md
            --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md
            --verbose --no-progress './**/*.md' './**/*.html'
